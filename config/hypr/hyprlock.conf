general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgb(080808)
    blur_passes = 2
    blur_size = 5
    brightness = 0.42
    contrast = 0.92
    noise = 0.015
}

label {
    monitor =
    text = $TIME
    color = rgb(D7D7DA)
    font_size = 54
    font_family = SF Pro Display
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d de %B'
    color = rgb(85858B)
    font_size = 13
    font_family = SF Pro Display
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 230, 42
    outline_thickness = 1
    dots_size = 0.18
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgb(48484E)
    inner_color = rgba(10, 10, 12, 0.88)
    font_color = rgb(D7D7DA)
    font_family = SF Pro Display
    fade_on_empty = false
    placeholder_text = <span foreground="##85858B">password</span>
    check_color = rgb(9FBEA0)
    fail_color = rgb(D89A9A)
    fail_text = <span foreground="##D89A9A">$FAIL</span>
    capslock_color = rgb(D2BD8C)
    rounding = 8
    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] sh -c 'printf "󰁹 %s%%" "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --)"'
    color = rgb(85858B)
    font_size = 11
    font_family = GeistMono Nerd Font
    position = 0, 22
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(85858B)
    font_size = 10
    font_family = GeistMono Nerd Font
    position = 18, 18
    halign = right
    valign = bottom
}
