# Hyprland configuration for the ThinkPad T480

monitor = ,preferred,auto,1

$terminal = alacritty
$menu = rofi -show drun
$mainMod = SUPER

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,kzdot
env = HYPRCURSOR_THEME,kzdot
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = GDK_DPI_SCALE,0.9
env = QT_FONT_DPI,86

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user restart xdg-desktop-portal-hyprland.service xdg-desktop-portal.service
exec-once = hyprctl setcursor kzdot 24
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user restart dunst.service
exec-once = $HOME/.local/bin/start-notification-monitors
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swaybg -i $HOME/Images/Wallpapers/px2.png -m fill

input {
    kb_layout = br
    kb_model = thinkpad
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 3
    gaps_out = 7
    border_size = 1
    col.active_border = rgb(48484E)
    col.inactive_border = rgb(101012)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    animation = windows, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# terminal
windowrule = border_color rgb(0B0B0D) rgb(080808), match:class Alacritty

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, alacritty -e yazi
bind = $mainMod SHIFT, E, exec, alacritty -e $HOME/.local/bin/file-picker
bind = $mainMod, V, exec, $HOME/.local/bin/clipboard-menu
bind = $mainMod, A, exec, $HOME/.local/bin/audio-menu
bind = $mainMod, F1, exec, $HOME/.local/bin/shortcut-center
bind = $mainMod, N, exec, dunstctl close
bind = $mainMod SHIFT, N, exec, dunstctl history-pop
bind = $mainMod CTRL, N, exec, dunstctl action
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, J, layoutmsg, togglesplit
bind = $mainMod SHIFT, L, exec, $HOME/.local/bin/lockscreen
bind = $mainMod SHIFT, P, exec, $HOME/.local/bin/power-menu
bind = $mainMod SHIFT, F, exec, $HOME/.local/bin/focus-mode

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, $HOME/.local/bin/volume-control up
bindel = , XF86AudioLowerVolume, exec, $HOME/.local/bin/volume-control down
bindl = , XF86AudioMute, exec, $HOME/.local/bin/volume-control mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, $HOME/.local/bin/brightness-control up
bindel = , XF86MonBrightnessDown, exec, $HOME/.local/bin/brightness-control down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod SHIFT, S, exec, env QT_QPA_PLATFORM=wayland XDG_CURRENT_DESKTOP=Hyprland flameshot screen --number 0 --edit

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
