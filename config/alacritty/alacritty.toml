[window]
opacity = 1.0
padding = { x = 8, y = 6 }
decorations = "None"
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 10.5

[colors.primary]
background = "#080808"
foreground = "#D7D7DA"

[colors.cursor]
text = "#080808"
cursor = "#C5C5CA"

[colors.selection]
text = "#E2E2E4"
background = "#29292D"

[colors.normal]
black = "#101012"
red = "#D89A9A"
green = "#9FBEA0"
yellow = "#D2BD8C"
blue = "#9FADB8"
magenta = "#B4A5B8"
cyan = "#9FB9B4"
white = "#C8C8CC"

[colors.bright]
black = "#5C5C62"
red = "#E2AAAA"
green = "#AFCBAF"
yellow = "#DDC99C"
blue = "#ADB9C2"
magenta = "#C1B2C5"
cyan = "#ACC6C1"
white = "#E0E0E2"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
chars = "\u001b[25~"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
