[window]
opacity = 1.0
padding = { x = 0, y = 0 }
decorations = "None"
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.5

[colors.primary]
background = "#080808"
foreground = "#E6EAF0"

[colors.cursor]
text = "#111318"
cursor = "#8FB7FF"

[colors.selection]
text = "#F7F9FC"
background = "#2A3140"

[colors.normal]
black = "#20242C"
red = "#FF6B6B"
green = "#7ED7A8"
yellow = "#F2C66D"
blue = "#8FB7FF"
magenta = "#C7A4FF"
cyan = "#79D7D2"
white = "#D9DEE7"

[colors.bright]
black = "#3A4250"
red = "#FF8585"
green = "#98E6BA"
yellow = "#F6D58A"
blue = "#A8C7FF"
magenta = "#D4B8FF"
cyan = "#94E5E1"
white = "#F7F9FC"
