[colors]
background = #0d0e19
foreground = #d8d6e9
accent = #aaa2d4
workspace = #aaa2d4
muted = #716e85

[bar/example]
width = 100%
height = 26px
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 2px
border-bottom-color = ${colors.accent}
padding-left = 5
padding-right = 5
module-margin = 1
font-0 = JetBrainsMono Nerd Font:bold:size=9;2
modules-left = xworkspaces
modules-center =
modules-right = vpn systray pulseaudio xkeyboard backlight battery date power
wm-restack = i3
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = false
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.workspace}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.accent}
label-urgent-padding = 1

[module/vpn]
type = custom/script
exec = ~/.config/polybar/vpn-ip.sh
interval = 3
format = <label>
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.foreground}
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.muted}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = " %layout%"
label-layout-foreground = ${colors.foreground}

[module/backlight]
type = custom/script
exec = echo " $(brightnessctl | grep -oP '\(\K[0-9]+(?=%)')%"
interval = 2
format-foreground = ${colors.foreground}
click-left = ~/.config/polybar/brightness-up.sh
click-right = ~/.config/polybar/brightness-down.sh
scroll-up = ~/.config/polybar/brightness-up.sh
scroll-down = ~/.config/polybar/brightness-down.sh

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
format-charging =   <label-charging>
format-discharging =   <label-discharging>
format-full =   <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
poll-interval = 5

[module/date]
type = internal/date
interval = 1
date = " %I:%M %p"
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}
label-padding = 1

[module/power]
type = custom/script
exec = echo "󰐥"
interval = 600
format-foreground = ${colors.accent}
format-padding = 1
click-left = ~/.config/polybar/power-menu.sh
