[colors]
background = #0d0e19
foreground = #d8d6e9
accent = #d52d40
workspace = #aaa2d4
muted = #716e85

[bar/example]
width = 100%
height = 26px
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 2px
border-bottom-color = ${colors.accent}
padding-left = 5
padding-right = 5
module-margin = 1
font-0 = JetBrainsMono Nerd Font:bold:size=9;2
modules-left = launcher xworkspaces
modules-center =
modules-right = vpn systray pulseaudio xkeyboard date power
wm-restack = i3
enable-ipc = true

[module/launcher]
type = custom/text
content = ▦
content-foreground = ${colors.foreground}
content-padding = 2
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = false
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.workspace}
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.accent}
label-urgent-padding = 1

[module/vpn]
type = custom/script
exec = ~/.config/polybar/vpn-ip.sh
interval = 3
format = <label>
label = %output%
label-foreground = ${colors.foreground}
label-padding = 1

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.foreground}
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.muted}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = " %layout%"
label-layout-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = " %I:%M %p"
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}
label-padding = 1

[module/power]
type = custom/script
exec = echo "󰐥"
interval = 600
format-foreground = ${colors.accent}
format-padding = 1
click-left = ~/.config/polybar/power-menu.sh
