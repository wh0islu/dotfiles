# Match the prompt colors with the waybar/GTK palette.
#   #6bd6d6 cyan accent, #9fbea0 green, #ff5f5f error

format = """
$directory\
$git_branch$git_status\
$python
$character"""

add_newline = true

[directory]
style = "bold #6bd6d6"
truncate_to_repo = false
truncation_length = 1
truncation_symbol = ""
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "#ff5f5f"

[git_branch]
symbol = ""
style = "bold #9fbea0"
format = "[$branch]($style) "

[git_status]
style = "bold #ff5f5f"
format = "[$all_status$ahead_behind]($style) "

[python]
symbol = ""
version_format = "${raw}"
format = "[$version]($style) "
style = "bold #9fbea0"
pyenv_version_name = false
python_binary = ["python", "python3"]
detect_files = [".python-version", "pyproject.toml", "requirements.txt", "Pipfile", "setup.py", "tox.ini"]

[character]
success_symbol = "[λ](bold #6bd6d6)"
error_symbol = "[λ](bold #ff5f5f)"
vimcmd_symbol = "[λ](bold #9fbea0)"
